name: 'Delete Helix World'
description: 'Deletes a Helix world automatically'
inputs:
  access_token:
    description: 'Access token for authentication. Can be generated at Account -> Settings'
    required: true
  world_name:
    description: 'Name of the world to delete. Make sure you already have this world created.'
    required: true
  master_endpoint:
    description: 'Defaults to https://api.helixgame.com/v1'
    required: false
    default: 'https://api.helixgame.com/v1'

runs:
  using: 'composite'
  steps:
    - name: Delete World
      shell: bash
      env:
        ACCESS_TOKEN: ${{ inputs.access_token }}
        MASTER_ENDPOINT: ${{ inputs.master_endpoint }}
        WORLD_NAME: ${{ inputs.world_name }}
      run: |
        response=$(curl "${MASTER_ENDPOINT}/world/${WORLD_NAME}" -X DELETE -H 'Accept: application/json, text/plain, */*' -H 'Accept-Language: en,en-US;q=0.5' --header "Token: ${ACCESS_TOKEN}")
        code=$(echo $response | jq -r '.code')
        message=$(echo $response | jq -r '.message')
        if [ "$code" != "0" ]; then
          echo "Error: Server returned error code $code with message '$message'"
          exit 1
        fi
